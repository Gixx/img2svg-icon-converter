[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixicon"
version = "0.1.2"
description = "Pixicon — convert images to pixelated SVG icons"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Gabor Ivan" }]
dependencies = [
    "Pillow>=10.0.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
packaging = ["pyinstaller>=6.3"]

[project.scripts]
pixicon = "pixicon.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
